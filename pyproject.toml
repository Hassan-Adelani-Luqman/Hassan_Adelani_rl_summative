[project]
name = "afya-sentinel"
version = "0.1.0"
description = "Afya Sentinel: reinforcement-learning dispatch of a mobile malaria early-detection van (TorchRL: DQN, REINFORCE, A2C, PPO)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.7",
    "torchrl>=0.9",
    "tensordict>=0.9",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false

# CPU-only PyTorch wheels on Linux/Windows (≈200 MB instead of multi-GB CUDA builds);
# macOS uses the default PyPI wheels, which are CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
